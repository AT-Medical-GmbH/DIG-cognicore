---
name: Bug Report
description: Report a bug or unexpected behaviour in CogniCore™
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report – CogniCore™
        > A product by AT Medical GmbH®

        Thank you for taking the time to report a bug. Please fill in the details below so we can investigate efficiently.

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      description: Which CogniCore™ module is affected?
      options:
        - CogniCompanion™ (viewer / remote)
        - CogniCoordinator™ (admin / teacher)
        - CogniConnect™ (polls / Q&A / signals)
        - CogniCaption™ (captions / translation)
        - CogniCoach™ (session coaching tools)
        - CogniCapture™ (recording)
        - CogniControl™ (auth / session management)
        - Infrastructure / CI / Deployment
        - Other / Unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CogniCore™ Version
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local Development
        - Staging
        - Production
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any relevant logs, error messages, or attach screenshots.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have included all required information
          required: true
        - label: This is NOT a security vulnerability (use SECURITY.md for those)
          required: true
