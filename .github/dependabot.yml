# Dependabot Configuration – CogniCore™
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── Root workspace (pnpm) ──────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - AT-Medical-GmbH/platform-core
    assignees:
      - AT-Medical-GmbH/devops
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      next-js:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      testing:
        patterns:
          - "jest*"
          - "@jest/*"
          - "vitest*"
          - "@testing-library/*"

  # ── apps/web-admin ────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/apps/web-admin"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - automated
      - web-admin
    commit-message:
      prefix: "chore(deps/web-admin)"

  # ── apps/web-teacher ─────────────────────────────────────
