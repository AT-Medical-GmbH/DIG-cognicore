# ============================================================
# AT Medical – Dependency Check Workflow
# Repository: DIG-cognicore
# ============================================================
#
# Audits npm/pnpm dependencies for known vulnerabilities and
# checks for outdated packages on a regular schedule.

name: Dependency Check

on:
  push:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: |
          pnpm audit --audit-level=high || {
            echo "⚠️  High or critical severity vulnerabilities found."
            echo "Please review and update affected packages."
            exit 1
          }

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Repository: AT-Medical/DIG-cognicore" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install license-checker
        run: pnpm add -g license-checker

      - name: Check licenses
        shell: bash
        run: |
          # Disallow licenses incompatible with commercial use
          FORBIDDEN="GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0"
          license-checker --excludePrivatePackages --onlyAllow \
            "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;0BSD;Python-2.0;BlueOak-1.0.0" \
            --out /tmp/licenses.csv || {
              echo "⚠️  Incompatible or unlisted licenses detected."
              cat /tmp/licenses.csv
              exit 1
            }
          echo "✅ All dependency licenses are compliant."
